<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Silicon Architect</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; display: grid; place-items: center; width: 100vw; height: 100vh">
    <!-- CSS for this canvas makes the element to always fit the screen and to avoid overflowing it either by height or by width -->
    <canvas
      id="unity-canvas"
      width=960
      height=600
      tabindex="-1"
      style="
        width: 100vw;
        height: 62.5vw;
        max-height: 100vh;
        max-width: 160vh;
        background: #231F20"
    />
    <script src="Build/Web.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      // GitHub Pages refuses files over 100 MB, so Tools > Release splits the data file for it and lists the parts
      // here; they're joined into a blob URL. Everywhere else this stays empty and the data file loads as built.
      var dataParts = [];
      var dataUrl = dataParts.length == 0
        ? Promise.resolve("Build/Web.data")
        : Promise.all(dataParts.map((part) => fetch("Build/" + part).then((r) => {
            if (!r.ok) throw new Error("Build/" + part + ": HTTP " + r.status);
            return r.blob();
          }))).then((blobs) => URL.createObjectURL(new Blob(blobs)));

      dataUrl.then((url) => createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: url,
        // A blob URL is new every load, so Unity's IndexedDB cache would store another copy each time. The parts
        // are still cached by the browser's HTTP cache.
        ...(dataParts.length == 0 ? {} : { cacheControl: (u) => /\.bundle/.test(u) ? "must-revalidate" : "no-store" }),
        frameworkUrl: "Build/Web.framework.js",
        codeUrl: "Build/Web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "BiteMe Games",
        productName: "Silicon Architect",
        productVersion: "v2026.10.10",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      })).then((unityInstance) => {
          window.unityInstance = unityInstance;
      });
    </script>
  </body>
</html>
